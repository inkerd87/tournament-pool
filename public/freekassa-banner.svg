<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 170 42" width="170" height="42">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0f17"/>
      <stop offset="100%" stop-color="#141a24"/>
    </linearGradient>
    <linearGradient id="fkGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#00e5a3" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <!-- Background Card -->
  <rect x="0.5" y="0.5" width="169" height="41" rx="8" fill="url(#bgGrad)" stroke="#232d3f" stroke-width="1"/>
  
  <!-- Subtle Top Accent -->
  <path d="M 8 0.5 L 162 0.5" stroke="url(#glowGrad)" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Logo Mark -->
  <g transform="translate(10, 8)">
    <rect width="26" height="26" rx="6" fill="#18202e" stroke="#2a374d" stroke-width="0.8"/>
    <!-- Stylized FK letterform -->
    <path d="M7 6.5 H18 V9.5 H10.5 V11.5 H16 V14 H10.5 V19.5 H7.5 V6.5 Z" fill="url(#fkGrad)"/>
    <circle cx="19" cy="18.5" r="2.2" fill="#00e5a3"/>
  </g>

  <!-- Typography -->
  <text x="44" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="900" fill="#ffffff" letter-spacing="0.6">FREE-KASSA</text>
  <text x="44" y="31" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="8" font-weight="700" fill="#00e5a3" letter-spacing="0.8">ПРИЁМ ПЛАТЕЖЕЙ</text>

  <!-- Badge Dots / Mini Icons -->
  <g transform="translate(142, 20)">
    <circle cx="0" cy="0" r="3" fill="#ff6b00" opacity="0.9"/>
    <circle cx="8" cy="0" r="3" fill="#00b4d8" opacity="0.9"/>
    <circle cx="16" cy="0" r="3" fill="#10b981" opacity="0.9"/>
  </g>
</svg>
