<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2a0808"/>
      <stop offset="100%" stop-color="#0a0303"/>
    </radialGradient>
    <linearGradient id="lava" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4a2b"/>
      <stop offset="50%" stop-color="#d92510"/>
      <stop offset="100%" stop-color="#8a1205"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="256" height="256" rx="40" fill="url(#bg)" stroke="#ff4a2b" stroke-opacity="0.3" stroke-width="4"/>
  <!-- Glowing River Path -->
  <path d="M48 208 L208 48 L188 32 L32 192 Z" fill="url(#lava)" filter="url(#glow)"/>
  <!-- Dire Corner (Top Right) -->
  <path d="M120 44 L204 44 L204 128 L160 84 Z" fill="url(#lava)" filter="url(#glow)"/>
  <!-- Radiant Corner (Bottom Left) -->
  <path d="M52 128 L52 212 L136 212 L92 168 Z" fill="url(#lava)" filter="url(#glow)"/>
</svg>
